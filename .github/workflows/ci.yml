name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit + envtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.6

      - name: Run tests
        run: make test

  charts:
    name: Helm lint + template tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Add Helm repos
        run: |
          helm repo add traefik https://traefik.github.io/charts
          helm repo add jetstack https://charts.jetstack.io
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm repo update

      - name: Helm lint
        run: make test-charts

      - name: Guard against renamed metrics-server values key
        # The subchart key was renamed to metrics-server in 1.0.4; Helm
        # silently ignores the old camelCase key (#454). Keep the old
        # spelling out of scripts/docs/manifests — CHANGELOG is the only
        # place it may appear. The bracketed pattern keeps this step from
        # matching its own definition.
        run: |
          if git grep -nE "metricsServ[e]r" -- '*.sh' '*.md' '*.yaml' '*.yml' ':!CHANGELOG.md'; then
            echo "::error::found stale camelCase metrics-server key (renamed in 1.0.4)"
            exit 1
          fi

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Install k3d
        run: |
          curl -fsSL -o /usr/local/bin/k3d "https://github.com/k3d-io/k3d/releases/download/v5.8.3/k3d-linux-amd64"
          echo "dbaa79a76ace7f4ca230a1ff41dc7d8a5036a8ad0309e9c54f9bf3836dbe853e  /usr/local/bin/k3d" | sha256sum --check
          chmod +x /usr/local/bin/k3d

      - name: Run integration tests
        run: make test-integration

      - name: Dump cluster diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n mortise-system describe pods || true
          kubectl -n mortise-system logs -l app.kubernetes.io/name=mortise --tail=300 --all-containers --prefix || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -80 || true

      - name: Tear down integration cluster
        if: always()
        run: k3d cluster delete mortise-int || true

  lint:
    name: Go vet + staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        # Direct pinned install instead of dominikh/staticcheck-action: the
        # action's internal cache collides with setup-go's cache:true
        # (deterministic 'File exists' tar errors on restore), and setup-go's
        # module cache already covers the install.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...

  ui:
    name: UI typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: cd ui && npm ci

      - name: Typecheck
        run: cd ui && npm run check

      - name: Build
        run: cd ui && npm run build

  ui-e2e:
    name: UI E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Install k3d
        run: |
          curl -fsSL -o /usr/local/bin/k3d "https://github.com/k3d-io/k3d/releases/download/v5.8.3/k3d-linux-amd64"
          echo "dbaa79a76ace7f4ca230a1ff41dc7d8a5036a8ad0309e9c54f9bf3836dbe853e  /usr/local/bin/k3d" | sha256sum --check
          chmod +x /usr/local/bin/k3d

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ui/package-lock.json') }}

      - name: Start dev cluster
        run: make dev-up

      - name: Run UI E2E tests
        run: make test-e2e

      - name: Dump cluster diagnostics on failure
        if: failure()
        run: |
          kubectl --context k3d-mortise-dev get pods -A -o wide || true
          kubectl --context k3d-mortise-dev -n mortise-system describe pods || true
          kubectl --context k3d-mortise-dev -n mortise-system logs -l app.kubernetes.io/name=mortise --tail=300 --all-containers --prefix || true
          kubectl --context k3d-mortise-dev get events -A --sort-by=.lastTimestamp | tail -80 || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ui/test-results/
            ui/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down dev cluster
        if: always()
        run: make dev-down
