name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  image:
    name: Build + push image
    runs-on: ubuntu-latest
    # Tag-gated so a manual workflow_dispatch (used to exercise the
    # chart-integration job pre-merge) does NOT push a branch-tagged image —
    # dispatch bypasses the tags-only trigger, and this job has no other guard.
    # No-op for real tag runs, which already satisfy this condition.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: meta-observer
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-observer
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: build-operator
        uses: docker/build-push-action@v5
        with:
          context: .
          target: operator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign operator image
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-operator.outputs.digest }}

      - name: Verify operator image signature
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-operator.outputs.digest }}

      - id: build-observer
        uses: docker/build-push-action@v5
        with:
          context: .
          target: observer
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-observer.outputs.tags }}
          labels: ${{ steps.meta-observer.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign observer image
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-observer@${{ steps.build-observer.outputs.digest }}

      - name: Verify observer image signature
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-observer@${{ steps.build-observer.outputs.digest }}

  cli:
    name: Build CLI binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cross-compile CLI
        run: make build-cli-all

      - uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: bin/mortise-*

  # Behavioral pre-publish gate: full umbrella-chart deploy on a real k3d
  # cluster (PVC persistence, toggle lifecycle, standalone core, install
  # script). Complements the chart job's post-publish artifact verification —
  # that proves the published bytes, this proves the chart behaves before
  # anything is published (mo-jp7; the suite previously ran nowhere).
  chart-integration:
    name: Chart integration (pre-publish gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Also runs on manual workflow_dispatch so this exact job can be exercised
    # on the real runner from a branch before merge (a tag-only job is otherwise
    # unverifiable pre-merge). Only THIS job opens up: the publish jobs stay
    # tag-gated, and chart's `needs` on this job keeps publishing blocked on a
    # dispatch run.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # test-chart-integration depends on build-ui (npm build embedded into the
      # operator binary), so the job needs Node — the integration job this
      # setup is otherwise modeled on does not build the UI and omits it.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Install k3d
        run: |
          curl -fsSL -o /usr/local/bin/k3d "https://github.com/k3d-io/k3d/releases/download/v5.8.3/k3d-linux-amd64"
          echo "dbaa79a76ace7f4ca230a1ff41dc7d8a5036a8ad0309e9c54f9bf3836dbe853e  /usr/local/bin/k3d" | sha256sum --check
          chmod +x /usr/local/bin/k3d

      - name: Run chart integration suite
        run: make test-chart-integration

      - name: Dump cluster diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true
          kubectl -n mortise-system logs deploy/mortise --tail=100 || true

      - name: Tear down chart cluster
        if: always()
        run: k3d cluster delete mortise-chart || true

  chart:
    name: Package + publish chart
    runs-on: ubuntu-latest
    needs: [image, chart-integration]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Stamp chart version + image tag
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          # The in-repo placeholder must never escape as a release (see
          # RELEASING.md "Placeholder version policy").
          if [ -z "$VERSION" ] || [ "$VERSION" = "0.0.0-dev" ]; then
            echo "::error::refusing to publish placeholder version '$VERSION'"
            exit 1
          fi
          for chart in charts/mortise charts/mortise-core; do
            sed -i "s/^version: .*/version: ${VERSION}/" "${chart}/Chart.yaml"
            sed -i "s/^appVersion: .*/appVersion: \"${VERSION}\"/" "${chart}/Chart.yaml"
          done
          # Keep the mortise-core subchart pin in the umbrella chart in sync.
          sed -i '/name: mortise-core/{n;s/version:.*/version: "'"${VERSION}"'"/}' charts/mortise/Chart.yaml
          # Stamp operator image tag in mortise-core values.
          sed -i "s/^  tag: .*/  tag: ${VERSION}/" charts/mortise-core/values.yaml
          # Stamp observer image tag in umbrella values.
          sed -i "s|image: ghcr.io/mortise-org/mortise-observer:.*|image: ghcr.io/mortise-org/mortise-observer:${VERSION}|" charts/mortise/values.yaml

      - name: Package charts
        run: |
          mkdir -p /tmp/charts
          helm repo add jetstack https://charts.jetstack.io
          helm repo add traefik https://traefik.github.io/charts
          helm package charts/mortise-core -d /tmp/charts
          helm dependency update charts/mortise
          helm package charts/mortise -d /tmp/charts

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Merge new charts into gh-pages index
        run: |
          # Published chart artifacts are immutable (RELEASING.md): a version
          # that already exists on gh-pages must never be overwritten — that
          # would change what a pinned --version serves.
          for tgz in /tmp/charts/*.tgz; do
            name="$(basename "$tgz")"
            if [ -e "gh-pages/$name" ] && ! cmp -s "$tgz" "gh-pages/$name"; then
              echo "::error::$name already published with different content; refusing to overwrite"
              exit 1
            fi
          done
          cp /tmp/charts/*.tgz gh-pages/
          cd gh-pages
          helm repo index . --url https://mortise-org.github.io/mortise --merge index.yaml

      - name: Commit and push gh-pages
        run: |
          cd gh-pages
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Publish charts ${{ steps.v.outputs.version }}"
          git push origin gh-pages

      - name: Verify published chart
        # The published artifact is what users install — verify what actually
        # landed, not what we think we packaged. Pull the just-published
        # version back through the public repo URL and prove it (a) is
        # byte-identical to the tarball this run built, and (b) renders the
        # bits whose absence caused #446/#379: the registry-proxy DaemonSet
        # under registry.enabled=true, and the buildruns RBAC. This is the
        # published-artifact counterpart of make verify-chart-dependency-drift
        # (which guards the in-repo vendored subchart).
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          # gh-pages deployment is asynchronous — poll until the new version
          # is served (or fail after ~5 minutes).
          for i in $(seq 1 30); do
            if curl -fsSL "https://mortise-org.github.io/mortise/index.yaml" | grep -q "version: ${VERSION}\$"; then
              break
            fi
            [ "$i" = 30 ] && { echo "::error::published index never served version ${VERSION}"; exit 1; }
            sleep 10
          done
          helm repo add mortise-published https://mortise-org.github.io/mortise
          helm repo update mortise-published
          pulldir=$(mktemp -d)
          helm pull mortise-published/mortise --version "${VERSION}" -d "$pulldir"
          # (a) byte-identical to what this run packaged.
          cmp "$pulldir/mortise-${VERSION}.tgz" "/tmp/charts/mortise-${VERSION}.tgz"
          # (b) semantic spot-checks on the rendered output of the PULLED copy.
          rendered=$(mktemp)
          helm template mortise "$pulldir/mortise-${VERSION}.tgz" \
            --namespace mortise-system \
            --set registry.enabled=true \
            --set platformConfig.domain=example.com > "$rendered"
          grep -B5 "name: registry-proxy" "$rendered" | grep -q "kind: DaemonSet" \
            || { echo "::error::published chart does not render the registry-proxy DaemonSet"; exit 1; }
          for res in buildruns buildruns/finalizers buildruns/status; do
            grep -q "$res" "$rendered" \
              || { echo "::error::published chart RBAC is missing ${res}"; exit 1; }
          done
          echo "published chart ${VERSION} verified: byte-identical + renders registry-proxy and buildruns RBAC"

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [image, chart, cli]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-binaries
          path: cli-binaries

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: cli-binaries/*
