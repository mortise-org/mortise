# ============================================================================
# Mortise — batteries-included deploy platform
# ============================================================================
# This chart bundles the operator (mortise-core), an ingress controller
# (Traefik), cert-manager, a container registry, and BuildKit. Each
# dependency can be disabled if you already have it or don't need it.
#
# For a minimal install (operator + CRDs only), use the mortise-core chart.

# ---------------------------------------------------------------------------
# Operator (mortise-core subchart)
# ---------------------------------------------------------------------------
mortise-core:
  # image is intentionally omitted so the mortise-core subchart default (and
  # the tag CI stamps at release) flows through. An override here was pinning a
  # stale operator version that release.yml never restamped.
  replicaCount: 1

  # Mirrors the subchart default: parent templates cannot see subchart
  # defaults, and the operator ServiceMonitor's condition must read the
  # real value — a `| default true` there would eat an explicit false.
  metrics:
    enabled: true
    port: 8080

  api:
    port: 8090

  operator:
    ingressClassName: ""
    tmpSizeLimit: null

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: false

  # See charts/mortise-core/values.yaml for sizing rationale (#447): one pod
  # runs controllers + API + build orchestration, and concurrent builds OOM
  # under smaller limits. GOMEMLIMIT auto-tracks limits.memory.
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 200m
      memory: 512Mi

  serviceAccount:
    create: true
    name: mortise-controller

  # PSA labels for the release namespace (mortise-system). Default off — see
  # charts/mortise-core/values.yaml for the Helm ownership caveat: only enable
  # on a fresh install, without --create-namespace. For existing installs use
  # kubectl label (docs/install.md, "Namespaces and Pod Security Admission").
  systemNamespace:
    create: false
    podSecurityLabels:
      enforce: baseline
      audit: restricted
      warn: restricted

  github:
    clientID: ""

# ---------------------------------------------------------------------------
# Traefik — ingress controller
# ---------------------------------------------------------------------------
# Disable if your cluster already has an ingress controller (e.g. k3s
# bundles Traefik, EKS may use ALB, etc.)
traefik:
  enabled: true
  namespaceOverride: mortise-deps
  # Values passed to the Traefik subchart. See:
  # https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml
  logs:
    access:
      enabled: true
      format: json
      fields:
        headers:
          defaultMode: drop

# ---------------------------------------------------------------------------
# cert-manager — automatic TLS certificates
# ---------------------------------------------------------------------------
# Disable if cert-manager is already installed in your cluster.
cert-manager:
  enabled: true
  # Values passed to the cert-manager subchart.
  crds:
    enabled: true

# ---------------------------------------------------------------------------
# TLS — automatic certificate issuance via cert-manager
# ---------------------------------------------------------------------------
# When acme.email is set and cert-manager is enabled, a default ClusterIssuer
# is created and wired into PlatformConfig automatically.
tls:
  acme:
    # email is the ACME registration email (required for Let's Encrypt).
    # Leave empty to skip automatic ClusterIssuer creation.
    email: ""
    # issuerName is the name of the ClusterIssuer to create.
    issuerName: letsencrypt-prod
    # server is the ACME directory URL.
    server: https://acme-v02.api.letsencrypt.org/directory

# ---------------------------------------------------------------------------
# Build infrastructure namespace
# ---------------------------------------------------------------------------
buildInfra:
  namespace: mortise-deps
  # createNamespace renders the (PSA-labeled) Namespace manifest for the build
  # infra. Set false when the namespace already exists outside Helm's
  # ownership — the install would otherwise fail — and label it yourself:
  #   kubectl label namespace mortise-deps \
  #     pod-security.kubernetes.io/enforce=privileged \
  #     pod-security.kubernetes.io/audit=privileged \
  #     pod-security.kubernetes.io/warn=privileged
  # BuildKit (privileged) and the registry proxy (hostPort) will not start
  # under a stricter PSA level.
  createNamespace: true

# ---------------------------------------------------------------------------
# OCI registry — stores images built from git source
# ---------------------------------------------------------------------------
# Storage defaults to PVC so built images survive pod restarts. Requires a
# default StorageClass (k3s ships with local-path, cloud providers have their
# own). Set to "emptyDir" only for throwaway dev/test clusters.
registry:
  enabled: true
  image: distribution/distribution:2.8.3
  storage: pvc
  storageSize: 10Gi
  # The Distribution registry runs fine as non-root; fsGroup makes the
  # storage volume (PVC or emptyDir) group-writable for it.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  # Node-local pull-through proxy — a DaemonSet that runs on every node so
  # kubelet can pull images from localhost instead of cluster-internal DNS.
  proxy:
    hostPort: 30500
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

# ---------------------------------------------------------------------------
# BuildKit — builds container images from git source
# ---------------------------------------------------------------------------
# Storage defaults to PVC so the layer cache survives restarts (faster
# rebuilds). Set to "emptyDir" if you don't care about build cache.
buildkit:
  enabled: true
  image: moby/buildkit:v0.29.0
  # privileged is required for the default (rootful) BuildKit mode. Setting a
  # non-empty buildkit.securityContext below overrides this flag entirely —
  # use that to run BuildKit rootless.
  privileged: true
  podSecurityContext: {}
  securityContext: {}
  storage: pvc
  storageSize: 10Gi

# ---------------------------------------------------------------------------
# metrics-server — provides the PodMetrics API for real-time CPU/memory
# ---------------------------------------------------------------------------
# Disable if metrics-server is already installed in your cluster.
metrics-server:
  enabled: true
  args:
    - --kubelet-insecure-tls

# ---------------------------------------------------------------------------
# Observer — built-in short-term metrics + log history (adapter contract)
# ---------------------------------------------------------------------------
# Provides zero-config observability. Implements the same adapter contract
# that external adapters (Loki, Prometheus) implement, so you can swap it
# out by pointing PlatformConfig.spec.observability at your own adapter.
observer:
  enabled: true
  image: ghcr.io/mortise-org/mortise-observer:0.1.1
  storage: emptyDir
  storageSize: 2Gi
  retention:
    metrics: 72h
    logs: 48h
    traffic: 48h
  metricsPollInterval: 60s
  maxLogPods: 100
  trafficBucketSize: 5s
  prometheus:
    # prometheus.io/* scrape annotations on the observer Service. On by
    # default — the endpoint is read-only text exposition.
    scrapeAnnotations: true
    # ServiceMonitor for kube-prometheus-stack users. Off by default: the
    # CRD does not exist without prometheus-operator installed.
    serviceMonitor:
      enabled: false
      interval: 30s
      labels: {}

# ---------------------------------------------------------------------------
# PlatformConfig — auto-created default configuration
# ---------------------------------------------------------------------------
platformConfig:
  enabled: true
  domain: ""
  externalDomain: ""
  buildPlatform: ""
  defaults:
    resources:
      cpu: "100m"
      memory: "256Mi"
