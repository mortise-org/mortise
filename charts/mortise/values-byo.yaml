# =============================================================================
# Mortise — BYO (Bring Your Own) example values
# =============================================================================
# Use this file as a starting point when you bring your own infrastructure
# instead of using the bundled components. Uncomment and fill in the sections
# that apply to your setup.
#
# Install:
#   helm install mortise mortise/mortise \
#     --namespace mortise-system --create-namespace \
#     -f values-byo.yaml
#
# Full docs: docs/byo.md

# ---------------------------------------------------------------------------
# Ingress controller
# ---------------------------------------------------------------------------
# Disable the bundled Traefik if you already have an ingress controller.
traefik:
  enabled: false

# Tell the operator which IngressClass to use for App Ingresses.
mortise-core:
  operator:
    ingressClassName: nginx   # e.g. nginx, traefik, alb
  # Expose the Mortise UI/API via your ingress controller:
  # ingress:
  #   enabled: true
  #   className: nginx
  #   host: mortise.example.com

# ---------------------------------------------------------------------------
# cert-manager
# ---------------------------------------------------------------------------
# Disable if cert-manager is already installed in your cluster.
cert-manager:
  enabled: false

# ---------------------------------------------------------------------------
# Container registry
# ---------------------------------------------------------------------------
# Disable the bundled registry if you use ECR, GHCR, Harbor, etc.
registry:
  enabled: false

# ---------------------------------------------------------------------------
# BuildKit
# ---------------------------------------------------------------------------
# Disable the bundled BuildKit if you run your own.
# buildkit:
#   enabled: false

# ---------------------------------------------------------------------------
# metrics-server
# ---------------------------------------------------------------------------
# Disable if metrics-server is already installed.
# metricsServer:
#   enabled: false

# ---------------------------------------------------------------------------
# PlatformConfig — point Mortise at your external infrastructure
# ---------------------------------------------------------------------------
platformConfig:
  enabled: true
  domain: apps.example.com
  # externalDomain: mortise.example.com

  # External registry (required when registry.enabled=false)
  registry:
    url: https://ghcr.io/my-org    # or https://123456789.dkr.ecr.us-east-1.amazonaws.com
    namespace: mortise              # registry namespace / project for built images
    insecureSkipTLSVerify: false
    pullSecretRef: registry-pull    # name of an existing docker-registry Secret

  # External BuildKit (required when buildkit.enabled=false)
  # build:
  #   buildkitAddr: tcp://buildkit.example.com:1234

  # TLS — reference an existing cert-manager ClusterIssuer
  tls:
    clusterIssuer: letsencrypt-prod
