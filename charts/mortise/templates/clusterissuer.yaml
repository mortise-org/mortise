{{- if and (index .Values "cert-manager" "enabled") .Values.tls.acme.email }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.tls.acme.issuerName }}
  labels:
    {{- include "mortise.labels" . | nindent 4 }}
spec:
  acme:
    email: {{ .Values.tls.acme.email }}
    server: {{ .Values.tls.acme.server }}
    privateKeySecretRef:
      name: {{ .Values.tls.acme.issuerName }}-account-key
    solvers:
      - http01:
          ingress: {}
{{- end }}
