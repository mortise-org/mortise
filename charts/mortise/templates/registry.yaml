{{- if .Values.registry.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: {{ include "mortise.depsNamespace" . }}
  labels:
    app.kubernetes.io/name: registry
    {{- include "mortise.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
    spec:
      {{- with .Values.registry.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and (dig "migrateOwnership" true .Values.registry) (ne .Values.registry.storage "emptyDir") }}
      # Data written by a release whose registry ran as root is unwritable
      # for the non-root registry, and fsGroup cannot fix ownership on NFS
      # or hostPath volumes (CAI-313). Runs as root, exits immediately when
      # the top-level dir already has the right owner.
      initContainers:
        - name: migrate-ownership
          image: {{ .Values.registry.image }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              uid={{ dig "podSecurityContext" "runAsUser" 1000 .Values.registry }}
              gid={{ dig "podSecurityContext" "runAsGroup" 1000 .Values.registry }}
              if [ -d /var/lib/registry/docker ] && [ "$(stat -c %u /var/lib/registry/docker)" != "$uid" ]; then
                echo "migrating /var/lib/registry ownership to $uid:$gid"
                chown -R "$uid:$gid" /var/lib/registry
              fi
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      {{- end }}
      containers:
        - name: registry
          image: {{ .Values.registry.image }}
          imagePullPolicy: IfNotPresent
          {{- with .Values.registry.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: REGISTRY_HTTP_ADDR
              value: "0.0.0.0:5000"
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          {{- if eq .Values.registry.storage "emptyDir" }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: registry-data
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: {{ include "mortise.depsNamespace" . }}
  labels:
    app.kubernetes.io/name: registry
    {{- include "mortise.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: registry
  ports:
    - name: http
      port: 5000
      targetPort: 5000
{{- if ne .Values.registry.storage "emptyDir" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: {{ include "mortise.depsNamespace" . }}
  labels:
    app.kubernetes.io/name: registry
    {{- include "mortise.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.registry.storageSize | default "10Gi" }}
{{- end }}
{{- end }}
