image:
  repository: ghcr.io/mortise-org/mortise
  tag: 0.1.1
  pullPolicy: IfNotPresent

replicaCount: 1

api:
  port: 8090

operator:
  # ingressClassName sets the Kubernetes IngressClass on App Ingresses.
  # When empty, the cluster default is used.
  ingressClassName: ""
  # tmpSizeLimit optionally sets a sizeLimit on the operator /tmp emptyDir.
  # Leave unset to let Kubernetes choose the default behavior.
  tmpSizeLimit: null

metrics:
  # Prometheus text exposition on the operator (build outcomes, App
  # phases). Plain HTTP, cluster-internal, read-only.
  enabled: true
  port: 8080

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  # className: ""
  # host: mortise.example.com
  # certManagerClusterIssuer: letsencrypt-prod

# One pod runs the controllers, the API server, and all build orchestration
# goroutines; the informer cache also holds build-log ConfigMaps (~900KB each,
# up to 10 per app environment). Concurrent builds under the old 512Mi limit
# OOM-killed the controller and terminally failed active BuildRuns (#447).
# GOMEMLIMIT is derived from limits.memory automatically (see deployment.yaml).
# Scale limits.memory up with concurrent-build count and number of apps.
resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 200m
    memory: 512Mi

# Security context defaults — hardened out of the box.
# Override per-environment in your values override file.
podSecurityContext:
  runAsNonRoot: true
  # runAsUser/runAsGroup must be numeric: the image USER is created as UID
  # 65532 but declared by name, and kubelet cannot verify a non-numeric image
  # user against runAsNonRoot (fails with CreateContainerConfigError).
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Pod Security Admission labels for the namespace the operator installs into.
# Default off: Helm refuses to adopt a namespace it does not own, so enabling
# this on an EXISTING install (or together with --create-namespace) fails.
# For a FRESH install, enable it and drop --create-namespace — the chart then
# creates the namespace, labeled and Helm-owned:
#   helm install mortise ... --namespace mortise-system \
#     --set systemNamespace.create=true
# For existing installs, label the namespace directly instead:
#   kubectl label namespace mortise-system \
#     pod-security.kubernetes.io/enforce=baseline \
#     pod-security.kubernetes.io/audit=restricted \
#     pod-security.kubernetes.io/warn=restricted
systemNamespace:
  create: false
  # The operator itself satisfies "restricted". "baseline" enforce leaves
  # headroom for anything else you run in the namespace; tighten to
  # "restricted" if the operator is alone there.
  podSecurityLabels:
    enforce: baseline
    audit: restricted
    warn: restricted

serviceAccount:
  create: true
  name: mortise-controller

github:
  clientID: ""
