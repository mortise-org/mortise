image:
  repository: ghcr.io/mortise-org/mortise
  tag: 0.1.1
  pullPolicy: IfNotPresent

replicaCount: 1

api:
  port: 8090

operator:
  # ingressClassName sets the Kubernetes IngressClass on App Ingresses.
  # When empty, the cluster default is used.
  ingressClassName: ""
  # tmpSizeLimit optionally sets a sizeLimit on the operator /tmp emptyDir.
  # Leave unset to let Kubernetes choose the default behavior.
  tmpSizeLimit: null

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  # className: ""
  # host: mortise.example.com
  # certManagerClusterIssuer: letsencrypt-prod

resources:
  limits:
    cpu: 2000m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 128Mi

# Security context defaults — hardened out of the box.
# Override per-environment in your values override file.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  name: mortise-controller

github:
  clientID: ""
