apiVersion: apps/v1
kind: Deployment
metadata:
  name: mortise
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mortise
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mortise
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mortise
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mortise
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: api
              containerPort: {{ .Values.api.port }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          args:
            - --api-bind-address=:{{ .Values.api.port }}
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            # Plain HTTP like the observer: cluster-internal, read-only
            # telemetry; secure serving would force every scraper through
            # kube-rbac authn.
            - --metrics-secure=false
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SERVICE_ACCOUNT_NAME
              value: {{ .Values.serviceAccount.name }}
            - name: MORTISE_GITHUB_CLIENT_ID
              value: {{ .Values.github.clientID | quote }}
            {{- if .Values.operator.ingressClassName }}
            - name: MORTISE_INGRESS_CLASS
              value: {{ .Values.operator.ingressClassName | quote }}
            {{- end }}
            # Redirect temp writes to the writable emptyDir volume
            - name: TMPDIR
              value: /tmp
            # BuildKit's docker auth provider mkdirs $DOCKER_CONFIG (default
            # $HOME/.docker) even for anonymous registries; point it at the
            # writable emptyDir so readOnlyRootFilesystem doesn't fail builds.
            - name: DOCKER_CONFIG
              value: /tmp/.docker
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir:
            {{- with .Values.operator.tmpSizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mortise
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mortise
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  {{- if .Values.ingress.certManagerClusterIssuer }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.certManagerClusterIssuer | quote }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mortise
                port:
                  number: {{ .Values.service.port }}
  {{- if .Values.ingress.certManagerClusterIssuer }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: mortise-tls
  {{- end }}
{{- end }}
