# -----------------------------------------------------------------------------
# ClusterRole: mortise-controller
#
# Cluster-scoped permissions: Mortise CRDs, namespace lifecycle, and read-only
# access to workload resources (needed by the controller-runtime cache).
# Write access to namespace-scoped resources is granted per-namespace via
# mortise-controller-ns RoleBindings — see below.
#
# RBAC SCOPING NOTES (see #226):
#
#   The previous single ClusterRole granted full CRUD on Secrets, Pods/exec,
#   and workload resources cluster-wide. This split limits write access to
#   namespaces the operator manages (pj-* and the operator namespace), while
#   keeping cluster-wide read access required by controller-runtime's cache.
#
#   Remaining cluster-wide reads: controller-runtime watches resource types
#   globally (Secrets, Pods, etc.). Restrict with OPA/Kyverno if needed.
# -----------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mortise-controller
rules:
  # ---------------------------------------------------------------------------
  # Mortise CRDs — full lifecycle management
  # ---------------------------------------------------------------------------

  - apiGroups: ["mortise.mortise.dev"]
    resources: ["projects", "projects/status", "projects/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["mortise.mortise.dev"]
    resources: ["apps", "buildruns"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["mortise.mortise.dev"]
    resources: ["platformconfigs", "gitproviders", "previewenvironments", "projectmembers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["mortise.mortise.dev"]
    # Keep in sync with config/rbac/role.yaml (kubebuilder-generated) — the
    # verify-chart-dependency-drift target asserts every generated resource
    # is granted here, so a marker added in code without a chart update
    # fails CI instead of failing finalizer writes at runtime.
    resources: ["apps/finalizers", "buildruns/finalizers", "gitproviders/finalizers", "platformconfigs/finalizers", "previewenvironments/finalizers", "projects/finalizers"]
    verbs: ["update"]
  - apiGroups: ["mortise.mortise.dev"]
    resources: ["apps/status", "buildruns/status", "gitproviders/status", "platformconfigs/status", "previewenvironments/status", "projectmembers/status"]
    verbs: ["get", "update", "patch"]

  # ---------------------------------------------------------------------------
  # Namespaces (cluster-wide — names are dynamic: pj-{project}[-{env}])
  # ---------------------------------------------------------------------------
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ---------------------------------------------------------------------------
  # RoleBindings — the Project controller creates one per pj-* namespace to
  # bind the SA to the namespace-scoped ClusterRole.
  # ---------------------------------------------------------------------------
  # NOTE (self-grant caveat, #441): cluster-wide rolebindings write means the
  # operator can bind mortise-controller-ns into ANY namespace — required for
  # per-project namespace bootstrap. Operators who want to fence this can use
  # OPA/Kyverno; recipes live in docs/hardening.md (mo-r6i).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Kubernetes escalation prevention requires the SA to hold `bind` on the
  # ClusterRole it references in those RoleBindings. Pinned by resourceNames
  # so the operator can only bind the one role it already effectively owns.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames: ["mortise-controller-ns"]

  # ---------------------------------------------------------------------------
  # Read-only access to workload resources (controller-runtime cache)
  #
  # The cache requires cluster-wide list/watch. Write access is granted
  # per-namespace via the mortise-controller-ns ClusterRole + RoleBindings.
  # ---------------------------------------------------------------------------

  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch"]

  # ---------------------------------------------------------------------------
  # Pod observability — read-only (no write needed at any scope)
  # ---------------------------------------------------------------------------
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # Cluster dashboard (obs-v2 O5): node allocatable totals for the
  # capacity strip on /api/dashboard. Read-only, list/get only, no proxy —
  # the observer holds the nodes/proxy grant for kubelet stats, not the
  # operator.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
# -----------------------------------------------------------------------------
# ClusterRole: mortise-controller-ns
#
# Namespace-scoped write permissions, bound per-namespace via RoleBindings.
# The Project controller creates a RoleBinding in every pj-* namespace; the
# Helm chart creates one in the operator namespace for OAuth/config secrets.
# -----------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mortise-controller-ns
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "update", "patch", "delete"]

  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "update", "patch", "delete"]

  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "update", "patch", "delete"]

  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["create", "update", "patch", "delete"]

  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "patch", "delete"]

  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "update", "patch", "delete"]

  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["create", "update", "patch", "delete"]

  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["create", "update", "patch", "delete"]

  # pods/exec — used by the /api/.../exec endpoint for user pods
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mortise-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mortise-controller
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
---
# In its own namespace the operator writes only Secrets (users, tokens, the
# JWT key, git-provider webhook secrets, registry credentials) and
# ConfigMaps (activity store). It used to bind the full mortise-controller-ns
# ClusterRole here -- Deployments, Services, PVCs, Ingresses, CronJobs,
# pods/exec -- none of which it manages in the release namespace (#444,
# #441's narrowing half). Workload namespaces still get the ClusterRole via
# the per-project RoleBinding the Project controller creates.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mortise-operator-ns
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mortise-controller-ns
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mortise-operator-ns
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
