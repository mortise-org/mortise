# Cluster-scoped ClusterRole: only permissions that genuinely require
# cluster-wide access (CRDs are cluster-scoped, namespace lifecycle).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mortise-controller
rules:
  # Mortise CRDs (cluster-scoped resources)
  - apiGroups: ["mortise.mortise.dev"]
    resources: ["projects", "projects/status", "projects/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["mortise.mortise.dev"]
    resources: ["apps", "apps/status", "apps/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["mortise.mortise.dev"]
    resources: ["platformconfigs", "gitproviders", "previewenvironments", "projectmembers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["mortise.mortise.dev"]
    resources: ["platformconfigs/status", "gitproviders/status", "previewenvironments/status", "previewenvironments/finalizers", "projectmembers/status"]
    verbs: ["get", "update", "patch"]
  # Namespaces: the Project controller creates/deletes one per Project + env.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # RBAC bootstrapping: the Project controller creates a RoleBinding in each
  # managed namespace to grant the operator namespace-scoped permissions.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# Namespace-scoped ClusterRole: defines permissions the operator needs inside
# each managed namespace (pj-*). Bound per-namespace via RoleBinding, NOT via
# ClusterRoleBinding — the operator only gets these permissions in namespaces
# it explicitly manages.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mortise-controller-ns
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "secrets", "persistentvolumeclaims", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Pod logs for SSE streaming
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # Pod exec for /api/projects/{project}/apps/{app}/exec
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mortise-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mortise-controller
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
