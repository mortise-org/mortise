# -----------------------------------------------------------------------------
# ClusterRole: mortise-controller
#
# Cluster-scoped permissions: Mortise CRDs, namespace lifecycle, and read-only
# access to workload resources (needed by the controller-runtime cache).
# Write access to namespace-scoped resources is granted per-namespace via
# mortise-controller-ns RoleBindings — see below.
#
# RBAC SCOPING NOTES (see #226):
#
#   The previous single ClusterRole granted full CRUD on Secrets, Pods/exec,
#   and workload resources cluster-wide. This split limits write access to
#   namespaces the operator manages (pj-* and the operator namespace), while
#   keeping cluster-wide read access required by controller-runtime's cache.
#
#   Remaining cluster-wide reads: controller-runtime watches resource types
#   globally (Secrets, Pods, etc.). Restrict with OPA/Kyverno if needed.
# -----------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mortise-controller
rules:
  # ---------------------------------------------------------------------------
  # Mortise CRDs — full lifecycle management
  # ---------------------------------------------------------------------------

  - apiGroups: ["mortise.mortise.dev"]
    resources: ["projects", "projects/status", "projects/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["mortise.mortise.dev"]
    resources: ["apps", "buildruns"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["mortise.mortise.dev"]
    resources: ["platformconfigs", "gitproviders", "previewenvironments", "projectmembers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["mortise.mortise.dev"]
    resources: ["apps/finalizers", "buildruns/finalizers"]
    verbs: ["update"]
  - apiGroups: ["mortise.mortise.dev"]
    resources: ["apps/status", "buildruns/status", "gitproviders/status", "platformconfigs/status", "previewenvironments/status", "projectmembers/status"]
    verbs: ["get", "update", "patch"]

  # ---------------------------------------------------------------------------
  # Namespaces (cluster-wide — names are dynamic: pj-{project}[-{env}])
  # ---------------------------------------------------------------------------
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ---------------------------------------------------------------------------
  # RoleBindings — the Project controller creates one per pj-* namespace to
  # bind the SA to the namespace-scoped ClusterRole.
  # ---------------------------------------------------------------------------
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Kubernetes escalation prevention requires the SA to hold `bind` on the
  # ClusterRole it references in those RoleBindings. Pinned by resourceNames
  # so the operator can only bind the one role it already effectively owns.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames: ["mortise-controller-ns"]

  # ---------------------------------------------------------------------------
  # Read-only access to workload resources (controller-runtime cache)
  #
  # The cache requires cluster-wide list/watch. Write access is granted
  # per-namespace via the mortise-controller-ns ClusterRole + RoleBindings.
  # ---------------------------------------------------------------------------

  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch"]

  # ---------------------------------------------------------------------------
  # Pod observability — read-only (no write needed at any scope)
  # ---------------------------------------------------------------------------
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
# -----------------------------------------------------------------------------
# ClusterRole: mortise-controller-ns
#
# Namespace-scoped write permissions, bound per-namespace via RoleBindings.
# The Project controller creates a RoleBinding in every pj-* namespace; the
# Helm chart creates one in the operator namespace for OAuth/config secrets.
# -----------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mortise-controller-ns
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "update", "patch", "delete"]

  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "update", "patch", "delete"]

  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "update", "patch", "delete"]

  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["create", "update", "patch", "delete"]

  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "patch", "delete"]

  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "update", "patch", "delete"]

  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["create", "update", "patch", "delete"]

  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["create", "update", "patch", "delete"]

  # pods/exec — used by the /api/.../exec endpoint for user pods
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mortise-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mortise-controller
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
---
# Static RoleBinding in the operator namespace so it can manage its own
# secrets (GitHub OAuth client secret, etc.).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mortise-controller-ns
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mortise-controller-ns
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
