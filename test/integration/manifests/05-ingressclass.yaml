# Default IngressClass for integration tests. The bundled Traefik
# subchart provides the controller; this resource registers the class
# so skipIfNoIngressClass passes and Mortise's ingress reconciliation
# can pick a default class.
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: traefik
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: traefik.io/ingress-controller
